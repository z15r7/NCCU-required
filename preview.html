        overflow: hidden;
        position: relative;
        background-color: var(--c-bg);
        box-shadow:

        background-color: transparent;
        position: relative;
      }

        background-color: var(--c-bg);
        position: relative;
        border-radius: var(--inner-card-radius);
        box-shadow:
          inset 4px 4px 8px rgba(163, 177, 198, 0.3),
          inset -4px -4px 8px rgba(255, 255, 255, 0.7);

        box-shadow: 0 4px 8px rgba(163, 177, 198, 0.25);
      }

      .shadow-layer-footer {
        z-index: 20;
        transition: box-shadow var(--accordion-motion);
      }

      .shadow-layer-footer-open {
        box-shadow: 0 -4px 8px rgba(255, 255, 255, 0.5);
      }

      .neumorphism-btn-active {
        color: var(--c-primary);
        font-weight: 700;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.2),
          inset -2px -2px 4px rgba(255, 255, 255, 0.8);

        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;

      .text-primary { color: var(--c-primary); }

      .bg-main { background-color: var(--c-text-main); }

      /**

        { id: "zu1-112-major", title: "ZU1 112 主修", kind: "子群：三軌擇二", subtitle: "本系：創新國際學院學士班" },
        { id: "zu1-113-major", title: "ZU1 113 主修", kind: "子群：擇二＋專業認定", subtitle: "本系：創新國際學院學士班" },
        { id: "781-double", title: "781 雙主修", kind: "合計：群A＋群B", subtitle: "雙主修：數位學" },
        { id: "783-double", title: "783 雙主修", kind: "合計：門數與學分各一", subtitle: "雙主修：人智應學士" },

      /**
       * 顯示文字，逐字取自 index.html 的 GC.uiText.progress／requirement、AbstractListItem 的對照表與 Notice 元件
       * （鍵＝後端列舉的值；只列預覽用得到者）。
       */
      const LABELS = Object.freeze({
        progress: { EXEMPTED: "免修", COMPLETED: "已修完", REMAINING: "剩餘", ACTUAL: "共計", QUOTA: "剩餘額度" },
        progressUnits: { CREDIT: "", COURSE: "門", RULE: "類" },
        requirementUnits: { CREDIT: "學分", COURSE: "門" },
        requirement: {
          TOTAL_REQUIRED: "應修習總數",
          NO_COURSE_GENERIC: "尚未修習此類課程",
          FOOTER_COMPLETED: "已達此類課程修習標準",
          FOOTER_STUDIED_PREFIX: "已修 ",
          FOOTER_STUDIED_SUFFIX: " 門課程",
        },
        scoreStatus: { WAIVED: "已抵免", PENDING: "未到", MISSING: "未修", WITHDRAWN: "停修", EXEMPTED: "免修", PASSED_TEXT: "通過", FAILED_TEXT: "不通過", UNKNOWN: "未知" },
        notes: { COUNTED_IN_OTHER_ITEM: "同一門課僅能擇一採計，已採計於其他項目" },
        messages: { VERIFY_COURSE_LIST_ON_WEBSITE: "＊此群組的課程清單公布於系所網頁，系統暫不檢核，請自行確認。" },

        isMet: (stat) => typeof stat.min === "number" && stat.actual >= stat.min,

      /**
       * 對應 index.html 的 ProgressStats（size small）與 createProgressEntry：取第一個未達門檻的統計項，
       * 依 scope（category／group）與 isCheckpoint 決定顯示「共計／剩餘／剩餘額度」或實心膠囊「已修完」。
       * 分支逐條沿用 demo，以便左右比較時呈現一致。
       */
      const ProgressStats = {
        props: {
          stats: Array,
          scope: { type: String, default: "category" },
          isCheckpoint: { type: Boolean, default: false },
        },
        setup(props) {
          const entryOf = (type, metric, value) => ({
            type,
            isPill: type === "COMPLETED",
            label: type === "COMPLETED" ? "" : LABELS.progress[type],
            value: type === "COMPLETED" ? LABELS.progress.COMPLETED : String(value),
            unit: type === "COMPLETED" ? "" : LABELS.progressUnits[metric],
          });
          const typesOf = (item) => {
            const hasMin = typeof item.min === "number" && item.min > 0;
            const remain = Math.max(0, item.remain ?? 0);
            const quota = Math.max(0, item.quota ?? 0);
            if (props.scope === "group" && !props.isCheckpoint && hasMin) {
              if (remain > 0) return [["ACTUAL", item.actual], ["REMAINING", remain]];
              if (quota > 0) return [["ACTUAL", item.actual], ["QUOTA", quota]];
              return [["COMPLETED", item.actual]];
            }
            if (props.scope === "group" && !props.isCheckpoint && quota > 0) {
              return [["ACTUAL", item.actual], ["QUOTA", quota]];
            }
            if (hasMin && item.actual >= item.min) return [["COMPLETED", item.actual]];
            if (hasMin && (props.scope === "category" || props.isCheckpoint)) return [["REMAINING", remain]];
            if (hasMin) return [["ACTUAL", item.actual], ["REMAINING", remain]];
            return [["ACTUAL", item.actual]];
          };
          const entries = computed(() => {
            const item = props.stats.find((stat) => (stat.remain ?? 0) > 0) || props.stats[0];
            return typesOf(item).map(([type, value]) => entryOf(type, item.metric, value));
          });
          const isCategory = computed(() => props.scope === "category");
          return { entries, isCategory };
        },
        template: `
          <div :class="[!isCategory ? 'justify-end' : '']">
            <div :class="['flex items-baseline gap-3 text-sm', !isCategory ? 'justify-end' : '']">
              <div v-for="(entry, idx) in entries" :key="idx" :class="['flex items-baseline gap-1', entry.isPill ? 'bg-main px-3 py-1 rounded-full shadow-sm text-inverse-main' : '']">
                <div v-if="entry.label" class="text-sm text-main">{{ entry.label }}</div>
                <div :class="[
                  'font-bold',
                  entry.isPill ? '' : (isCategory ? 'text-4xl' : ((entry.type === 'REMAINING' || entry.type === 'QUOTA') ? 'text-3xl' : 'text-2xl')),
                  entry.isPill ? '' : ((entry.type === 'REMAINING' || entry.type === 'QUOTA') ? 'text-primary' : 'text-main')
                ]">{{ entry.value }}</div>
                <div v-if="entry.unit" class="text-sm text-main">{{ entry.unit }}</div>
              </div>
            </div>
          </div>
        `,
      };

      /** 對應 index.html 的 resolveReqTotalText：列出有門檻的學分與門數（如「15 學分、5 門」）。 */
      const requirementTotalTextOf = (stats) =>
        [
          ["CREDIT", LABELS.requirementUnits.CREDIT],
          ["COURSE", LABELS.requirementUnits.COURSE],
        ]
          .flatMap(([metric, unit]) => {
            const stat = stats.find((item) => item.metric === metric);
            return stat && stat.min > 0 ? [`${stat.min} ${unit}`] : [];
          })
          .join("、");

      /** 對應 index.html 的 AbstractListItem：學期｜徽章＋課名｜成績｜學分，註記另起一列。 */

        setup(props) {
          const semesterLabel = computed(() => `${props.data.academicYear}-${props.data.semester}`);
          const gradeLabel = computed(() =>

              ? props.data.score.toFixed(2)
              : LABELS.scoreStatus[props.data.scoreStatus],
          );
          const isDimmed = computed(() => props.data.scoreStatus !== "NORMAL");
          const noteLabel = computed(() => (props.data.note ? LABELS.notes[props.data.note] : ""));
          return { semesterLabel, gradeLabel, isDimmed, noteLabel };
        },
        template: `
          <div class="relative px-4 py-3 grid grid-cols-[3.5rem_1fr_4rem_2rem] gap-x-2 gap-y-1 items-center text-sm">
            <div class="whitespace-nowrap font-medium text-main">{{ semesterLabel }}</div>

      /** 對應 index.html 的 InfoStatusRow：應修總數或群組訊息，文字列（text-xs 粗體主色）。 */
      const InfoRow = {
        props: ["hasBorder"],

      /**
       * 對應 index.html 的 AccordionCard 外框：表頭（標題＋統計）、可收合的內容、頁尾（修習狀態＋箭頭）。
       * 內容由 slot 提供，目前與提案的群組卡共用同一個外框。
       */
      const AccordionShell = {
        props: ["group", "initiallyOpen", "isExpandable"],
        components: { ProgressStats },
        setup(props) {
          const isOpen = ref(props.initiallyOpen && props.isExpandable);
          const toggle = () => {
            isOpen.value = props.isExpandable && !isOpen.value;
          };
          const footerLabel = computed(() => {
            if (props.group.stats.every((stat) => LABELS.isMet(stat))) return LABELS.requirement.FOOTER_COMPLETED;
            if (props.group.records.length > 0) {
              return `${LABELS.requirement.FOOTER_STUDIED_PREFIX}${props.group.records.length}${LABELS.requirement.FOOTER_STUDIED_SUFFIX}`;
            }
            return LABELS.requirement.NO_COURSE_GENERIC;
          });
          return { isOpen, toggle, footerLabel };
        },
        template: `
          <div class="accordion-container">
            <button type="button" @click="toggle" :disabled="!isExpandable" :aria-expanded="isOpen" :class="['p-4 flex justify-between items-end w-full text-left shadow-layer-header', isExpandable ? 'cursor-pointer' : 'cursor-default']">
              <span class="font-bold text-lg text-main">{{ group.label }}</span>
              <progress-stats :stats="group.stats" scope="group"></progress-stats>
            </button>
            <div v-if="isOpen" class="shadow-layer-body">
              <slot></slot>
            </div>
            <button type="button" @click="toggle" :disabled="!isExpandable" :aria-expanded="isOpen" :class="['p-3 w-full flex justify-between items-center text-xs shadow-layer-footer text-sub', isOpen ? 'shadow-layer-footer-open' : '', isExpandable ? 'cursor-pointer' : 'cursor-default']">
              <span class="font-medium text-sub">{{ footerLabel }}</span>
              <svg v-if="isExpandable" :class="['w-4 h-4 text-sub transition-transform duration-300', isOpen ? 'rotate-180' : '']" aria-hidden="true"><use href="#chevron"></use></svg>
            </button>
          </div>
        `,
      };

      /**
       * 目前的群組卡（對應 index.html AccordionCard 的內容）：應修總數列、群組訊息、課程列。
       * 與 demo 相同，只有課程或群組訊息時可展開。
       */
      const CurrentGroupCard = {
        props: ["group", "initiallyOpen"],
        components: { AccordionShell, InfoRow, CourseRow },
        setup(props) {
          const totalText = computed(() => requirementTotalTextOf(props.group.stats));
          const isExpandable = computed(() => props.group.records.length > 0 || Boolean(props.group.message));
          return { totalText, isExpandable, LABELS };
        },
        template: `
          <accordion-shell :group="group" :initially-open="initiallyOpen" :is-expandable="isExpandable">
            <info-row :has-border="Boolean(group.message) || group.records.length > 0">
              <span class="text-primary">{{ LABELS.requirement.TOTAL_REQUIRED }} ： {{ totalText }}</span>
              <span v-if="group.description" class="text-main font-normal">（{{ group.description }}）</span>
            </info-row>
            <info-row v-if="group.message" :has-border="group.records.length > 0">
              <p class="text-sm text-primary">{{ LABELS.messages[group.message] }}</p>
            </info-row>
            <course-row v-for="(record, idx) in group.records" :key="idx" :data="record" :has-border="idx < group.records.length - 1"></course-row>

      /** 目前的檢查點（對應 index.html FooterInfo）：只有標題與統計，description 不顯示。 */
      const CurrentCheckpoint = {
        props: ["group"],
        components: { ProgressStats },
        template: `
          <div class="flex justify-between items-center pt-0 pb-3 px-4">
            <div class="flex items-center gap-2 font-bold"><span class="text-lg text-main">{{ group.label }}</span></div>

      /**
       * 提案的群組卡：外框、應修總數列與課程列與目前相同；有子群時多一列各軌狀態膠囊
       * （達成＝demo「已修完」的實心膠囊，未達成＝空心淡色），課程依所屬的軌分列。
       * 影子（擇一採計後未採計的軌）照 demo 的課程列呈現，以 COUNTED_IN_OTHER_ITEM 註記說明。
       * 沒有子群時與目前的群組卡相同。
       */
      const ProposedGroupCard = {
        props: {
          group: Object,
          subgroups: { type: Array, default: () => [] },
          initiallyOpen: Boolean,
        },
        components: { AccordionShell, InfoRow, CourseRow, CurrentGroupCard },
        setup(props) {
          const totalText = computed(() => requirementTotalTextOf(props.group.stats));
          const tracks = computed(() =>
            props.subgroups.map((subgroup) => ({ ...subgroup, met: LABELS.isMet(subgroup.stats[0]) })),
          );
          return { totalText, tracks, LABELS };
        },
        template: `
          <current-group-card v-if="tracks.length === 0" :group="group" :initially-open="initiallyOpen"></current-group-card>
          <accordion-shell v-else :group="group" :initially-open="initiallyOpen" :is-expandable="true">
            <info-row :has-border="true">
              <span class="text-primary">{{ LABELS.requirement.TOTAL_REQUIRED }} ： {{ totalText }}</span>
              <span v-if="group.description" class="text-main font-normal">（{{ group.description }}）</span>
            </info-row>
            <info-row :has-border="true">
              <div class="flex flex-wrap gap-2 text-xs" role="list" aria-label="各軌達成狀態">
                <span v-for="track in tracks" :key="track.code" role="listitem" :class="['px-3 py-1 rounded-full', track.met ? 'bg-main shadow-sm text-inverse-main' : 'border-2 border-gray-300 text-sub']">{{ track.label }}</span>
              </div>
            </info-row>
            <template v-for="(track, trackIdx) in tracks" :key="track.code">
              <info-row :has-border="false">
                <span :class="track.met ? 'text-primary' : 'text-sub'">{{ track.label }}</span>
              </info-row>
              <div v-if="track.records.length === 0" class="relative px-4 pb-3 text-sm text-sub">
                {{ LABELS.requirement.NO_COURSE_GENERIC }}
                <div v-if="trackIdx < tracks.length - 1" class="absolute bottom-0 left-4 right-4 border-b border-gray-200"></div>
              </div>
              <course-row v-for="(record, idx) in track.records" :key="idx" :data="record" :has-border="idx < track.records.length - 1 || trackIdx < tracks.length - 1"></course-row>
            </template>
          </accordion-shell>
        `,
      };

      /**
       * 提案的檢查點：表頭列與 demo FooterInfo 相同（標題＋檢查點統計），其下以 demo 的平鋪清單外框列出組成項目。
       * 每列右側交給 ProgressStats 依資料顯示：須各自達成的項目為「已修完」膠囊或「剩餘 N」，
       * min 為 null 的貢獻量為「共計 N」；第二層組成項目並列於同一列。有貢獻量時另列合計（共計／剩餘）。條文可收合。
       */
      const ProposedCheckpoint = {
        props: ["group"],
        components: { ProgressStats, InfoRow },
        setup(props) {
          const hasContributions = computed(() =>
            props.group.components.some((component) => component.stats[0].min === null),
          );
          return { hasContributions };
        },
        template: `
          <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center pt-0 pb-1 px-4">
              <div class="flex items-center gap-2 font-bold"><span class="text-lg text-main">{{ group.label }}</span></div>
              <progress-stats :stats="group.stats" scope="group" :is-checkpoint="true"></progress-stats>
            </div>
            <div class="shadow-layer-single overflow-hidden">
              <div v-for="component in group.components" :key="component.code" class="relative px-4 py-3 flex justify-between items-center gap-4 text-sm">
                <span class="font-medium text-main">{{ component.label }}</span>
                <div v-if="component.components" class="flex items-center gap-5">
                  <div v-for="part in component.components" :key="part.code" class="flex items-center gap-2">
                    <span class="text-xs text-sub">{{ part.label }}</span>
                    <progress-stats :stats="part.stats" scope="group" :is-checkpoint="true"></progress-stats>
                  </div>
                </div>
                <progress-stats v-else :stats="component.stats" scope="group" :is-checkpoint="true"></progress-stats>
                <div class="absolute bottom-0 left-4 right-4 border-b border-gray-200"></div>
              </div>
              <div v-if="hasContributions" class="relative px-4 py-3 flex justify-between items-center gap-4 text-sm">
                <span class="font-bold text-main">合計</span>
                <progress-stats :stats="group.stats" scope="group"></progress-stats>
                <div class="absolute bottom-0 left-4 right-4 border-b border-gray-200"></div>
              </div>
              <info-row :has-border="false">
                <details>
                  <summary class="cursor-pointer">條文</summary>
                  <p class="mt-2 text-main font-normal leading-relaxed">{{ group.description }}</p>
                </details>
              </info-row>
            </div>
          </div>
        `,
      };

      /**
       * 條件節點的達成狀態與組合方式文字（條件樹、矩陣、下一步建議共用）。
       * 狀態只看節點自身第一個統計項；min 為 null 的節點是合計中的貢獻量，沒有達成與否。
       */
      const CONDITION = Object.freeze({
        stateOf: (stat) => {
          if (stat.min === null) return "CONTRIBUTION";
          if (stat.actual >= stat.min) return "MET";
          return stat.actual > 0 ? "PARTIAL" : "UNMET";
        },
        stateText: { MET: "已達成", PARTIAL: "部分達成", UNMET: "未達成" },
        combinatorTextOf: (node) =>
          ({ ALL: "全部達成", ANY: `任 ${node.stats[0].min} 項達成`, SUM: "合計" })[node.combinator] ?? "",
        unitOf: (metric) => LABELS.requirementUnits[metric] ?? "項",
        ratioOf: (stat) => Math.min(stat.actual / stat.min, 1),
        /** 兩層組成項目中達成比例加總最高的一列（並列取先出現者），只作顯示上的提示。 */
        closestOf: (rows) => {
          const scoreOf = (row) => row.components.reduce((total, part) => total + CONDITION.ratioOf(part.stats[0]), 0);
          return rows.reduce((best, row) => (scoreOf(row) > scoreOf(best) ? row : best));
        },
      });

      /** 狀態點：實心＝已達成、半實心＝部分達成、空心＝未達成（只用 demo 的主文字色與淡灰）。 */
      const StateDot = {
        props: ["state"],
        setup() {
          return { CONDITION };
        },
        template: `
          <span
            v-if="state !== 'CONTRIBUTION'"
            role="img"
            :aria-label="CONDITION.stateText[state]"
            :class="['inline-block w-3 h-3 rounded-full shrink-0 border-2', state === 'UNMET' ? 'border-gray-300' : 'border-main', state === 'MET' ? 'bg-main' : '']"
            :style="state === 'PARTIAL' ? 'background: linear-gradient(90deg, var(--c-text-main) 50%, transparent 50%)' : ''"
          ></span>
        `,
      };

      /**
       * 疊色進度條（合計型節點）：凹陷長條內依序填入各組成項目的貢獻（主色由深到淺），門檻處畫刻度。
       * 長條的比例尺取門檻與實得較大者，超過門檻時刻度落在長條內。
       */
      const StackedBar = {
        props: ["node"],
        setup(props) {
          const SHADES = [1, 0.65, 0.4, 0.2];
          const total = computed(() => props.node.stats[0]);
          const scale = computed(() => Math.max(total.value.min, total.value.actual, 1));
          const segments = computed(() =>
            props.node.components.map((component, idx) => ({
              code: component.code,
              label: component.label,
              actual: component.stats[0].actual,
              width: `${(component.stats[0].actual / scale.value) * 100}%`,
              opacity: SHADES[idx % SHADES.length],
            })),
          );
          const tickLeft = computed(() => `calc(${(total.value.min / scale.value) * 100}% - 2px)`);
          const unit = computed(() => CONDITION.unitOf(total.value.metric));
          return { total, segments, tickLeft, unit };
        },
        template: `
          <div class="flex flex-col gap-2">
            <div class="flex justify-end text-xs text-sub">{{ total.actual }}／{{ total.min }} {{ unit }}</div>
            <div class="relative h-3 rounded-full shadow-layer-single overflow-hidden" role="img" :aria-label="segments.map((s) => s.label + ' ' + s.actual).join('、')">
              <div class="absolute inset-0 flex">
                <div v-for="segment in segments" :key="segment.code" class="h-full bg-primary" :style="{ width: segment.width, opacity: segment.opacity }"></div>
              </div>
              <div class="absolute top-0 bottom-0 w-0.5 bg-main" :style="{ left: tickLeft }"></div>
            </div>
            <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-main">
              <span v-for="segment in segments" :key="segment.code" class="flex items-center gap-1">
                <span class="inline-block w-2.5 h-2.5 rounded-sm bg-primary" :style="{ opacity: segment.opacity }"></span>
                {{ segment.label }} {{ segment.actual }}
              </span>
            </div>
          </div>
        `,
      };

      /**
       * 矩陣（兩層組成項目，如專業認定：軌 × 群組）：每格為凹陷小長條，依達成比例填色並標示「實得／門檻」。
       * 各列以達成比例加總排序出最接近者（並列取先出現者），只作顯示上的提示。
       */
      const ConditionMatrix = {
        props: ["node"],
        components: { StateDot },
        setup(props) {
          const columns = computed(() => props.node.components[0].components.map((part) => part.label));
          const rows = computed(() =>
            props.node.components.map((component) => ({
              code: component.code,
              label: component.label,
              state: CONDITION.stateOf(component.stats[0]),
              cells: component.components.map((part) => ({
                code: part.code,
                state: CONDITION.stateOf(part.stats[0]),
                width: `${CONDITION.ratioOf(part.stats[0]) * 100}%`,
                text: `${part.stats[0].actual}／${part.stats[0].min} ${CONDITION.unitOf(part.stats[0].metric)}`,
              })),
            })),
          );
          const closestCode = computed(() => CONDITION.closestOf(props.node.components).code);
          return { columns, rows, closestCode };
        },
        template: `
          <div class="grid gap-x-4 gap-y-2 items-center text-xs" :style="{ gridTemplateColumns: 'auto repeat(' + columns.length + ', minmax(0, 1fr))' }" role="table">
            <span role="columnheader"></span>
            <span v-for="column in columns" :key="column" role="columnheader" class="text-sub font-medium">{{ column }}</span>
            <template v-for="row in rows" :key="row.code">
              <span role="rowheader" :class="['flex items-center gap-2 text-sm', row.code === closestCode ? 'font-bold text-main' : 'text-main']">
                <state-dot :state="row.state"></state-dot>{{ row.label }}<span v-if="row.code === closestCode" class="text-xs text-primary font-bold">最接近</span>
              </span>
              <div v-for="cell in row.cells" :key="cell.code" role="cell" class="flex flex-col gap-1">
                <div class="relative h-2 rounded-full shadow-layer-single overflow-hidden">
                  <div class="absolute inset-y-0 left-0 bg-primary" :style="{ width: cell.width }"></div>
                </div>
                <span :class="cell.state === 'MET' ? 'text-main font-bold' : 'text-sub'">{{ cell.text }}</span>
              </div>
            </template>
          </div>
        `,
      };

      /**
       * 條件樹節點（遞迴）：狀態點＋名稱＋組合方式＋統計（沿用 demo 的 ProgressStats）。
       * 子節點的畫法依資料：SUM 為疊色進度條、組成項目再有組成項目者為矩陣、其餘為縮排的子節點清單。
       */
      const ConditionNode = {
        name: "ConditionNode",
        props: ["node"],
        components: { StateDot, ProgressStats, StackedBar, ConditionMatrix },
        setup(props) {
          const children = computed(() => props.node.components ?? []);
          const layout = computed(() => {
            if (children.value.length === 0) return "LEAF";
            if (props.node.combinator === "SUM") return "BAR";
            return children.value.every((child) => child.components) ? "MATRIX" : "LIST";
          });
          const state = computed(() => CONDITION.stateOf(props.node.stats[0]));
          const combinatorText = computed(() => CONDITION.combinatorTextOf(props.node));
          return { children, layout, state, combinatorText };
        },
        template: `
          <div class="flex flex-col gap-3">
            <div class="flex justify-between items-center gap-4">
              <div class="flex items-center gap-2 min-w-0">
                <state-dot :state="state"></state-dot>
                <span class="font-bold text-main">{{ node.label }}</span>
                <span v-if="combinatorText" class="text-xs text-sub whitespace-nowrap">{{ combinatorText }}</span>
              </div>
              <progress-stats :stats="node.stats" scope="group" :is-checkpoint="layout !== 'LEAF'"></progress-stats>
            </div>
            <div v-if="layout !== 'LEAF'" class="ml-1.5 pl-4 border-l-2 border-gray-200 flex flex-col gap-3">
              <stacked-bar v-if="layout === 'BAR'" :node="node"></stacked-bar>
              <condition-matrix v-else-if="layout === 'MATRIX'" :node="node"></condition-matrix>
              <condition-node v-else v-for="child in children" :key="child.code" :node="child"></condition-node>
            </div>
          </div>
        `,
      };

      /** 條件樹：根節點為分類（各群組與附加條件全部達成），子節點為群組與檢查點，放在 demo 的平鋪清單外框內。 */
      const ConditionTree = {
        props: ["title", "stats", "groups", "checkpoints"],
        components: { ConditionNode },
        setup(props) {
          const root = computed(() => ({
            code: "root",
            label: props.title,
            combinator: "ALL",
            stats: props.stats,
            components: [
              ...props.groups.map((group) => ({ code: group.code, label: group.label, stats: group.stats })),
              ...props.checkpoints,
            ],
          }));
          return { root };
        },
        template: `
          <div class="shadow-layer-single p-4">
            <condition-node :node="root"></condition-node>
          </div>
        `,
      };

      /**
       * 下一步建議（簡化示意）：逐項列出未達成條件的最小缺口——群組與合計取剩餘，任 M 取剩餘最少的 M 項，
       * 矩陣取最接近的一列。各項分開計算，未考慮一門課同時滿足多項條件；最少補修組合須由後端計算。
       */
      const NextStepCard = {
        props: ["groups", "checkpoints"],
        components: { InfoRow },
        setup(props) {
          const remainOf = (stat) => `${stat.remain} ${CONDITION.unitOf(stat.metric)}`;
          const unmetFirst = (stats) => stats.find((stat) => stat.remain > 0);
          const groupSteps = () =>
            props.groups.flatMap((group) => {
              const stat = unmetFirst(group.stats);
              return stat ? [`${group.label} 再 ${remainOf(stat)}`] : [];
            });
          const anySteps = (checkpoint) => {
            const needed = checkpoint.stats[0].remain;
            const picks = checkpoint.components
              .filter((component) => CONDITION.stateOf(component.stats[0]) !== "MET")
              .sort((a, b) => a.stats[0].remain - b.stats[0].remain)
              .slice(0, needed)
              .map((component) => `${component.label} 再 ${remainOf(component.stats[0])}`);
            return [`${checkpoint.label}：${picks.join("；")}`];
          };
          const matrixSteps = (checkpoint) => {
            const closest = CONDITION.closestOf(checkpoint.components);
            const parts = closest.components
              .filter((part) => part.stats[0].remain > 0)
              .map((part) => `${part.label} 再 ${remainOf(part.stats[0])}`);
            return [`${checkpoint.label}：${closest.label} ${parts.join("、")}`];
          };
          const checkpointSteps = (checkpoint) => {
            if (checkpoint.stats[0].remain <= 0) return [];
            if (checkpoint.combinator === "SUM") return [`${checkpoint.label} 再 ${remainOf(checkpoint.stats[0])}`];
            return checkpoint.components.every((component) => component.components)
              ? matrixSteps(checkpoint)
              : anySteps(checkpoint);
          };
          const steps = computed(() => [...groupSteps(), ...props.checkpoints.flatMap(checkpointSteps)]);
          return { steps };
        },
        template: `
          <div class="shadow-layer-single overflow-hidden">
            <info-row :has-border="true">下一步（簡化示意）</info-row>
            <ol class="px-4 py-3 flex flex-col gap-2 text-sm text-main list-decimal list-inside">
              <li v-for="step in steps" :key="step">{{ step }}</li>
              <li v-if="steps.length === 0" class="list-none text-sub">群修條件皆已達成</li>
            </ol>
            <p class="px-4 pb-3 text-xs text-sub">＊各項分開計算，未考慮一門課同時滿足多項條件；最少補修組合須由後端計算。</p>
          </div>
        `,
      };

      /** 對應 index.html 的 CategoryHeader：分類圖示、小標（身分：系所）、分類名稱與分類統計。 */
      const CategoryHeader = {
        props: ["subtitle", "title", "stats"],
        components: { ProgressStats },
        template: `
          <div class="flex justify-between items-center w-full p-4">
            <div class="flex gap-5 min-w-0 flex-1 pr-2">
              <div class="w-12 h-12 flex items-center justify-center text-primary">
                <svg class="w-10 h-10" aria-hidden="true"><use href="#cluster"></use></svg>
              </div>
              <div class="flex flex-col justify-center min-w-0">
                <div class="text-xs font-medium mb-0.5 text-sub truncate">{{ subtitle }}</div>
                <div class="text-lg font-bold leading-none text-main">{{ title }}</div>
              </div>
            </div>
            <progress-stats :stats="stats" scope="category"></progress-stats>
          </div>
        `,
      };

      /**
       * 情境分頁（網址 hash 記住所選情境）× 呈現方式（?view=tree 為條件樹）× 左右並排（目前／提案）。
       * ?expanded 時群組卡預設展開；檢查點依 demo 雙欄版面的位置放在群組卡上方。
       */
      const VIEWS = Object.freeze([
        { id: "cards", title: "群組卡＋檢查點", note: "沿用 demo 版面，子群分列、組成項目逐列" },
        { id: "tree", title: "條件樹", note: "下一步建議＋條件樹（合計為疊色進度條、專業認定為矩陣）" },
      ]);

      const App = {
        components: { CategoryHeader, CurrentGroupCard, CurrentCheckpoint, ProposedGroupCard, ProposedCheckpoint, ConditionTree, NextStepCard },
        setup() {
          const params = new URLSearchParams(window.location.search);
          const initial = SCENARIOS.find((scenario) => `#${scenario.id}` === window.location.hash) ?? SCENARIOS[0];
          const isExpanded = params.has("expanded");
          const selected = ref(initial.id);
          const view = ref(VIEWS.find((item) => item.id === params.get("view"))?.id ?? VIEWS[0].id);
          const syncUrl = () => {
            params.set("view", view.value);
            history.replaceState(null, "", `?${params}#${selected.value}`);
          };
          const select = (id) => {
            selected.value = id;
            syncUrl();
          };
          const selectView = (id) => {
            view.value = id;
            syncUrl();
          };
          const scenario = computed(() => SCENARIOS.find((item) => item.id === selected.value));
          const current = computed(() => CURRENT_RESPONSES[selected.value]);
          const proposed = computed(() => PROPOSED_RESPONSES[selected.value]);
          return { SCENARIOS, VIEWS, LABELS, isExpanded, selected, select, view, selectView, scenario, current, proposed };
        },
        template: `
          <main class="max-w-6xl mx-auto px-4 py-8 flex flex-col gap-6">
            <header class="flex flex-col gap-3">
              <h1 class="text-2xl font-bold text-main">子群型與合計型條件呈現預覽</h1>
              <p class="text-sm text-sub">左側為目前 demo 畫面讀取的回應；右側為規劃中的 subgroups／components 形狀與分類統計（手寫範例）。</p>
              <nav class="flex flex-wrap gap-2" role="tablist" aria-label="情境">
                <button v-for="item in SCENARIOS" :key="item.id" type="button" role="tab" :aria-selected="selected === item.id" @click="select(item.id)" :class="['px-4 py-2 rounded-xl text-sm text-left', selected === item.id ? 'neumorphism-btn-active' : 'text-sub']">
                  <span class="block">{{ item.title }}</span>
                  <span class="block text-xs">{{ item.kind }}</span>
                </button>
              </nav>
              <nav class="flex flex-wrap gap-2" role="tablist" aria-label="呈現方式">
                <button v-for="item in VIEWS" :key="item.id" type="button" role="tab" :aria-selected="view === item.id" @click="selectView(item.id)" :class="['px-4 py-2 rounded-xl text-sm text-left', view === item.id ? 'neumorphism-btn-active' : 'text-sub']">
                  <span class="block">{{ item.title }}</span>
                  <span class="block text-xs">{{ item.note }}</span>
                </button>
              </nav>
            </header>
            <div class="grid gap-6 md:grid-cols-2">
              <section class="flex flex-col gap-4" aria-label="目前">
                <h2 class="text-xs font-medium text-sub px-1">目前</h2>
                <div class="neumorphism-card">
                  <category-header :subtitle="scenario.subtitle" :title="LABELS.categories.PARTIALLY_REQUIRED" :stats="current.stats"></category-header>
                </div>
                <div class="neumorphism-card p-4 flex flex-col gap-4">
                  <current-checkpoint v-for="group in current.checkpoints" :key="group.code" :group="group"></current-checkpoint>
                  <current-group-card v-for="group in current.requirements" :key="group.code" :group="group" :initially-open="isExpanded"></current-group-card>
                </div>
              </section>
              <section class="flex flex-col gap-4" aria-label="提案">
                <h2 class="text-xs font-medium text-sub px-1">提案</h2>
                <div class="neumorphism-card">
                  <category-header :subtitle="scenario.subtitle" :title="LABELS.categories.PARTIALLY_REQUIRED" :stats="proposed.stats"></category-header>
                </div>
                <div v-if="view === 'cards'" class="neumorphism-card p-4 flex flex-col gap-4">
                  <proposed-checkpoint v-for="group in proposed.checkpoints" :key="group.code" :group="group"></proposed-checkpoint>
                  <proposed-group-card v-for="group in current.requirements" :key="group.code" :group="group" :subgroups="proposed.subgroupsByGroup[group.code]" :initially-open="isExpanded"></proposed-group-card>
                </div>
                <div v-else class="neumorphism-card p-4 flex flex-col gap-4">
                  <next-step-card :groups="current.requirements" :checkpoints="proposed.checkpoints"></next-step-card>
                  <condition-tree :title="LABELS.categories.PARTIALLY_REQUIRED" :stats="proposed.stats" :groups="current.requirements" :checkpoints="proposed.checkpoints"></condition-tree>
                </div>
              </section>
            </div>
          </main>
        `,
      };

      createApp(App).mount("#app");
    </script>
  </body>
</html>
